<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #16162a;
      border-left: 1px solid #2a2a45;
      border-right: 1px solid #2a2a45;
    }

    .chat-header {
      padding: 18px 24px;
      background: #12122a;
      border-bottom: 1px solid #2a2a45;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e8e8f0;
    }

    .chat-header p {
      font-size: 12px;
      color: #7c7ca0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin-left: auto;
      box-shadow: 0 0 6px #4ade80;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a45 transparent;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 4px; }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.bot .msg-avatar  { background: linear-gradient(135deg, #6c63ff, #a78bfa); }
    .message.user .msg-avatar { background: linear-gradient(135deg, #3b82f6, #60a5fa); }

    .msg-bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.bot .msg-bubble {
      background: #1e1e38;
      border: 1px solid #2a2a45;
      border-top-left-radius: 4px;
      color: #ddddf0;
    }

    .message.user .msg-bubble {
      background: linear-gradient(135deg, #4f46e5, #6c63ff);
      border-top-right-radius: 4px;
      color: #fff;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #7c7ca0;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    .input-area {
      padding: 16px 20px;
      background: #12122a;
      border-top: 1px solid #2a2a45;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #userInput {
      flex: 1;
      background: #1e1e38;
      border: 1px solid #2a2a45;
      border-radius: 14px;
      color: #e8e8f0;
      font-size: 14px;
      padding: 12px 16px;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #userInput::placeholder { color: #555575; }
    #userInput:focus { border-color: #6c63ff; }

    #sendBtn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #6c63ff);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }

    #sendBtn:hover   { transform: scale(1.08); }
    #sendBtn:active  { transform: scale(0.95); }
    #sendBtn:disabled{ opacity: 0.4; cursor: not-allowed; }

    #sendBtn svg { width: 18px; height: 18px; fill: white; }

    .api-setup {
      background: #1e1e38;
      border: 1px solid #3a3a60;
      border-radius: 12px;
      padding: 20px;
      margin: 24px 20px;
    }

    .api-setup p { font-size: 13px; color: #9999bb; margin-bottom: 10px; }

    .api-row {
      display: flex;
      gap: 8px;
    }

    #apiKeyInput {
      flex: 1;
      background: #12122a;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
    }

    #apiKeyInput:focus { border-color: #6c63ff; }

    #saveKeyBtn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    #saveKeyBtn:hover { background: #4338ca; }

    .welcome-msg {
      text-align: center;
      color: #555575;
      font-size: 13px;
      padding: 12px 0;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div>
      <h1>My AI Assistant</h1>
      <p>Powered by Gemini</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- API Key Setup -->
  <div class="api-setup" id="apiSetup">
    <p>🔑 Enter your Gemini API key to start chatting. It is saved in your browser only.</p>
    <div class="api-row">
      <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key here..." />
      <button id="saveKeyBtn">Save Key</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome-msg">Your conversation starts here ✨</div>
  </div>

  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="Type a message..."></textarea>
    <button id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl  = document.getElementById('messages');
  const userInput   = document.getElementById('userInput');
  const sendBtn     = document.getElementById('sendBtn');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveKeyBtn  = document.getElementById('saveKeyBtn');
  const apiSetup    = document.getElementById('apiSetup');

  let API_KEY = localStorage.getItem('gemini_api_key') || '';
  let conversationHistory = [];

  if (API_KEY) {
    apiSetup.style.display = 'none';
    sendBtn.disabled = false;
  }

  saveKeyBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) return alert('Please enter a valid API key.');
    API_KEY = key;
    localStorage.setItem('gemini_api_key', key);
    apiSetup.style.display = 'none';
    sendBtn.disabled = false;
    addMessage('bot', '✅ API key saved! I\'m ready to chat. Ask me anything!');
  });

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  sendBtn.addEventListener('click', sendMessage);

  function addMessage(role, text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    messagesEl.appendChild(msgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message bot';
    msgDiv.id = 'typingMsg';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    messagesEl.appendChild(msgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typingMsg');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || !API_KEY) return;

    addMessage('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    conversationHistory.push({ role: 'user', parts: [{ text }] });

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: conversationHistory })
        }
      );

      const data = await res.json();

      if (data.error) {
        removeTyping();
        addMessage('bot', `❌ Error: ${data.error.message}`);
      } else {
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
        conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
        removeTyping();
        addMessage('bot', reply);
      }
    } catch (err) {
      removeTyping();
      addMessage('bot', '❌ Network error. Please check your internet connection.');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }
</script>
</body>
</html>
